[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Shared server code lives in netlify/lib and is pulled in by require().
  included_files = ["netlify/lib/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200